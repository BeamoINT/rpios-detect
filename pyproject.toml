[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpios-detect"
version = "0.2.0"
description = "Detect whether a MicroSD card (or boot volume/image) contains Raspberry Pi OS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "BeamoINT" }]
keywords = ["raspberry-pi", "raspberry-pi-os", "sd-card", "pi-gen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rpios-detect = "rpios_detect.cli:main"

[project.urls]
Homepage = "https://github.com/BeamoINT/rpios-detect"
Issues = "https://github.com/BeamoINT/rpios-detect/issues"
Changelog = "https://github.com/BeamoINT/rpios-detect/releases"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
